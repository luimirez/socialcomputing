<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Ad Management
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Ad Management</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Create Property Ad</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      Add a new property listing to the application. Fill in the details including title, price, address, description, and optionally images.
      <ion-button
        expand="block"
        class="ion-margin-top"
        (click)="goToAdCreation()">
         <ion-icon slot="start" name="add-circle-outline"></ion-icon>
         Create New Ad
      </ion-button>
    </ion-card-content>
  </ion-card>

  </ion-content>

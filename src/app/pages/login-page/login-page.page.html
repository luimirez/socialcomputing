<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Login</ion-title>
    </ion-toolbar>
  </ion-header>

  <form #loginForm="ngForm" (ngSubmit)="login()">
    <ion-list>
      <ion-item>
        <ion-label position="floating">Email</ion-label>
        <ion-input
          type="email"
          name="email"
          [(ngModel)]="loginCredentials.email"
          required
          email #emailInput="ngModel"
          autocomplete="email"
          inputmode="email"
        ></ion-input>
      </ion-item>
      <ion-note slot="error" *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)">
        Please enter a valid email address.
      </ion-note>

      <ion-item>
        <ion-label position="floating">Password</ion-label>
        <ion-input
          type="password"
          name="password"
          [(ngModel)]="loginCredentials.password"
          required #passwordInput="ngModel"
        ></ion-input>
      </ion-item>
       <ion-note slot="error" *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)">
        Password is required.
      </ion-note>
    </ion-list>

    <ion-button
      expand="block"
      type="submit"
      class="ion-margin-top"
      [disabled]="loginForm.invalid"
    >
      Login
    </ion-button>
  </form>

  <div class="ion-text-center ion-margin-top">
    <ion-text>Don't have an account? </ion-text>
    <ion-text color="primary" (click)="goToRegister()">Sign up</ion-text>
  </div>

</ion-content>

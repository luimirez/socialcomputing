<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Properties for Sale
    </ion-title>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Properties for Sale</ion-title>
    </ion-toolbar>
  </ion-header>

  <div *ngIf="properties$ | async as properties; else loadingOrError">

    <div *ngIf="properties.length === 0" class="ion-padding ion-text-center">
      <p>No properties found.</p>
      </div>

    <ion-list *ngIf="properties.length > 0">
      <ion-card *ngFor="let property of properties" (click)="goToPropertyDetail(property.id)" button="true">
        <img
          [src]="property.imageUrl || 'https://placehold.co/600x400/cccccc/ffffff?text=No+Image'"
          alt="Property image for {{ property.title }}"
          onerror="this.src='https://placehold.co/600x400/cccccc/ffffff?text=No+Image';"
        />
        <ion-card-header>
          <ion-card-title>{{ property.title }}</ion-card-title>
          <ion-card-subtitle>{{ property.price | currency:'USD':'symbol':'1.0-0' }}</ion-card-subtitle>
          </ion-card-header>
        <ion-card-content>
          <p>{{ property.address }}</p>
          <ion-chip outline="true" *ngIf="property.bedrooms">
             <ion-icon name="bed-outline"></ion-icon>
             <ion-label>{{ property.bedrooms }} Bed</ion-label>
          </ion-chip>
           <ion-chip outline="true" *ngIf="property.bathrooms">
             <ion-icon name="water-outline"></ion-icon> <ion-label>{{ property.bathrooms }} Bath</ion-label>
          </ion-chip>
        </ion-card-content>
      </ion-card>
    </ion-list>

  </div>

  <ng-template #loadingOrError>
    <div class="ion-padding ion-text-center">
          <ion-spinner name="crescent"></ion-spinner>
          <p>Loading properties...</p>
       </div>
    </ng-template>

</ion-content>
